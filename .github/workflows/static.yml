name: Deploy Torit ai to GitHub Pages

on:
  push:
    branches: [ "main" ] # অথবা আপনার ডিফল্ট ব্রাচ 'master' হলে এখানে master লিখবেন

  # ম্যানুয়ালি অ্যাকশন রান করার সুবিধা
  workflow_dispatch:

# গিটহাব পেজ ডিপ্লয়মেন্টের জন্য পারমিশন সেটআপ
permissions:
  contents: read
  pages: write
  id-token: write

# একসাথে একাধিক ডিপ্লয় কনফ্লিক্ট এড়ানোর concurrency
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # আপনার মূল প্রজেক্ট ফোল্ডারের পাথ (যেখানে index.html আছে)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
